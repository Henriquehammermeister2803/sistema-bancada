<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Bancada Estoque</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout-bancada">

   <aside class="menu-lateral">
    <h2>Bancada</h2>
     <button onclick="mostrar('dados')">Dados da Bancada</button>
    <a href="index.html" class="voltar">← Voltar</a>
  </aside>

   <main class="conteudo-bancada">

     <section id="dados" class="secao ativa">
      <h2>Dados da Bancada</h2>
      <p><strong>Nome:</strong> Bancada Estoque</p>
      <p><strong>Status:</strong> Operacional</p>
      <p><strong>Setor:</strong> Logística</p>
    </section>

     <section class="imagem-bancada">
      <img src="bancada_processo.png">
    </section>

  </main>
</div>

 <script>
function mostrar(id) {
  document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
  document.getElementById(id).classList.add('ativa');
}
</script>

</body>
</html>
